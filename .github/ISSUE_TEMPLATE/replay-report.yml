name: Report a replay discrepancy
description: Report an unexpected verdict using a synthetic example.
title: "Replay discrepancy: "
body:
  - type: input
    id: version
    attributes:
      label: Runtime and revision
      description: Include the Python version, OS and repository commit.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Include a synthetic input and the command. Exclude private staging data.
      render: text
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: Expected and observed behavior
      description: Include the exit code and relevant aggregate diagnostics.
    validations:
      required: true
